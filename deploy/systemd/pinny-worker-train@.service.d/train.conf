# Training pool (build_dataset, train_verifier, train_detector, benchmark).
# Training reads the labels (pinny.sqlite3), crops/ and models/, so this
# worker runs as the profile's web user and may write the whole data
# directory. It still has no network. A large memory cap and a low CPU
# weight keep uploads and scans responsive while a model trains.
[Service]
User=pinny-%i
Group=pinny-%i
ReadWritePaths=/srv/pinny/%i
MemoryMax=5G
CPUQuota=150%
CPUWeight=20
Nice=10
IOSchedulingClass=best-effort
IOSchedulingPriority=7
