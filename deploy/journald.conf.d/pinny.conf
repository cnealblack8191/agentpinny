# Installed as /etc/systemd/journald.conf.d/pinny.conf by pinny-bootstrap.
# Pinny's web and worker logs (and every other service's) go to the journal.
# Keep it on disk, at most 2 GB, and at most 30 days, so logs never fill the
# 100 GB volume. Caddy's access logs roll on their own (deploy/caddy/Caddyfile).
[Journal]
Storage=persistent
SystemMaxUse=2G
SystemKeepFree=5G
SystemMaxFileSize=128M
MaxRetentionSec=30day
