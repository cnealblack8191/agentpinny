# ask the coordinator for dependency changes; do not edit this file.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pinny"
version = "0.1.0"
description = "Pinny: local receptacle-pin detection prototype"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy==2.5.3",
    "opencv-python-headless==4.13.0.92",
    "pypdfium2==5.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pypdf==6.19.0",
]

[tool.setuptools.packages.find]
include = ["pinny*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
