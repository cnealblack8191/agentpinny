name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: pip install --require-hashes -r requirements.lock.txt
      - run: pip install -e . --no-deps
      - name: Unit tests
        run: python -m pytest -q tests evaluation/tests
      - name: Evaluator regression gate (mini corpus)
        run: >
          PYTHONPATH=evaluation python -m pinny_eval score-corpus
          --manifest evaluation/fixtures/corpus_mini/manifest.json
          --baseline evaluation/fixtures/corpus_mini/baseline.json
          --max-drop 0.01
