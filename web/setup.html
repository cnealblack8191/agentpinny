<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a password · Pinny</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth">
  <main class="auth-box">
    <h1>Choose your Pinny password</h1>
    <p id="who" class="muted">Checking your link…</p>
    <form id="setup-form" hidden>
      <label for="password">New password (at least 12 characters)</label>
      <input id="password" type="password" autocomplete="new-password" minlength="12" required>
      <label for="password2">Type it again</label>
      <input id="password2" type="password" autocomplete="new-password" minlength="12" required>
      <button type="submit">Save and sign in</button>
    </form>
    <p id="status" class="status" role="status"></p>
  </main>
  <script type="module" src="setup.js"></script>
</body>
</html>
